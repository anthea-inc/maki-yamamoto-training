<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />

    <title>入力タイプを学ぼう！</title>
  </head>

  <body>
    <label>button：</label>
    <input
      type="button"
      value="ボタンを押してね"
      onclick="alert('ボタンが押下されました')"
    /><br /><br>

    <label>checkbox：</label>
    <label>
        <input type="checkbox" name="option1" value="red"> 赤
      </label>
      <label>
        <input type="checkbox" name="option2" value="blue"> 青
      </label>
      <label>
        <input type="checkbox" name="option3" value="yellow"> 黄色
     </label>
     <br><br>

  <label>color：</label>
  <input
  type="color"
  value="#000000"
/><br /><br>

<label>date：</label>
<input
type="date"
/><br /><br>

<label>datetime-local：</label>
<input
type="datetime-local"
name="birthday"
/><br /><br>

<label>email：</label>
<input
type="email"
name="email"
/><br /><br>

<label>file：</label>
<input
type="file"
name="file"
/><br /><br>

<label>hidden：</label>
<p>非表示のデータ送信、サーバー間でのデータ保持が目的のため、見た目に変化なし</p>
<input
type="hidden"
name="hidden"
/><br /><br>

<label>image：</label>
<input 
type="image" 
src="../lesson21/image/DALL·E 2024-12-07 16.53.14 - A dramatic and apocalyptic lion symbolizing the end of an era, standing on a crumbling, jagged cliff overlooking a desolate wasteland. The lion's mane.webp" 
alt="Submit"
width="100" height="100">
<br /><br>

<label>month：</label>
<input
type="month"
name="month"
/><br /><br>

<label>number：</label>
<input
type="number"
name="number"
/><br /><br>

<label>password：</label>
<input
type="password"
name="password"
/><br /><br>

<label>radio：</label>
<label>
    <input type="radio" name="gender" value="woman"> 女性
  </label>
  <label>
    <input type="radio" name="gender" value="man"> 男性
  </label>
  <label>
    <input type="radio" name="gender" value="Non-binary？"> その他
 </label>
 <!--name属性の値が一緒じゃないと複数選択できてしまうので注意-->
<br /><br>

<label>range：</label>
<input
type="range"
name="range"
/><br /><br>

<label>reset：</label>
<input
type="reset"
name="reset"
/><br /><br>

<label>search：</label>
<input
type="search"
name="search"
/><br /><br>

<label>submit：</label>
<input
type="submit"
name="submit"
/><br /><br>

<label>tel：</label>
<input
type="tel"
name="tel"
/><br /><br>

<label>text：</label>
<input
type="text"
name="text"
placeholder="任意のテキストを入力"
/><br /><br>

<label>time：</label>
<input
type="time"
name="time"
/><br /><br>

<label>url：</label>
<input
type="url"
name="url"
/><br /><br>

<label>week：</label>
<input
type="week"
name="week"
/><br /><br>
  </body>
</html>
