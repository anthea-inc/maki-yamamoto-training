<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css-kadai23.css" />
    <title>CSS値関数の理解</title>
  </head>
  <body>
    <h2>calc()関数</h2>
    <p>通常のテキスト</p>
    <p class="box01">calc(16px + 1vw);を使ったテキスト</p>
    <h2>max()関数</h2>
    <div class="box02">
      width：150pxまたは50%のうち、最も大きい値が適用される
    </div>

    <h2>min()関数</h2>
    <div class="box03">width：500pxまた80%のうち、最も小さい値が適用される</div>
  </body>
</html>
