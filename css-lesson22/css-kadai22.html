<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>!importantの理解</title>
    <style>
      p {
        color: blue;
      }

      .important {
        color: red !important;
      }
    </style>
  </head>
  <body>
    <p>青い文字</p>
    <p class="important">赤い文字（!important 使用）</p>
  </body>
</html>
