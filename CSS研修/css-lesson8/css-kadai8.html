<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css-kadai8.css" />
    <title>アウトラインを学ぼう</title>
  </head>
  <body>
    <div class="box01">
      <p>outline-style：二重線を指定</p>
    </div>

    <div class="box02">
      <p>outline-width：太い線を指定</p>
    </div>

    <div class="box03">
      <p>outline-color：cyan色を指定</p>
    </div>

    <div class="box04">
      <p>outline：値を一括指定</p>
    </div>

    <div class="box05">
      <p>outline-offset：アウトラインを要素の境界から0.5em離す</p>
    </div>
  </body>
</html>
