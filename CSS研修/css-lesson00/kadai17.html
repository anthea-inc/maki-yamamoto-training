<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />

    <title>クラスを学ぼう！</title>
  </head>
  <body>
    <p class="class1">１つ目のクラスを作成：フォントカラーaquaを適用</p>
    <p class="class2">
      ２つ目のクラスを作成：フォントサイズ40px;とフォントカラーpinkを適用
    </p>
    <p class="class3">３つ目のクラスを作成：フォントをboldで太くするを適用</p>
    <hr />
    <p>
      複数の要素に共通のCSSスタイルを適用する方法を具体的なコード例を用いて説明してください。
    </p>
    <p>sample1、2、3にclass1で定義したスタイルを当てます</p>
    <p class="class1">sample1</p>
    <p class="class1">sample2</p>
    <p class="class1">sample3</p>
    <hr />
    <p>
      一つのHTML要素に複数のclassを指定し、異なるCSSスタイルを組み合わせて適用する具体例を挙げて説明してください。
    </p>

    <p class="class1 class3">class1とclass3を適用</p>
  </body>
</html>
