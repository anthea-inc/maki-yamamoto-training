<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>引用と出典を学ぼう！</title>
  </head>
  <body>
    <q>段落を指定する</q>

    <abbr title="株式会社Anthea">（株）Anthea</abbr>

    <address>
      <p>hogehoge@gmail.com</p>
    </address>

    <blockquote>
      <p>blockquote（ブロッククォート）タグは、転載・引用元を示すタグです。</p>
      <p>
        文献や概要など、一文では終わらないような長文を他サイトから引用する際に用いられます。
      </p>
      <p>
        記述方法は簡単で、引用したい文章をHTMLのblockquoteタグで囲むだけです。
      </p>
    </blockquote>

    <cite><a href="https://www.anthea.co.jp/">株式会社Antheaのサイト</a></cite>

    <p><bdo dir="ltr">文字を記述する方向を指定する</bdo></p>
    <p><bdo dir="rtl">文字を記述する方向を指定する</bdo></p>
  </body>
</html>
