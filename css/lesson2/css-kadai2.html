<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css-lesson2/css-kadai2.css" />
    <title>背景をデザインする</title>
  </head>
  <body>
    <div class="box01">background-color</div>
    <br />

    <div class="box02">background-image：背景画像を指定</div>
    <br />

    <div class="box03">background-repeat: repeat：背景画像を繰り返す</div>
    <br />

    <div class="box05">
      background-repeat: no-repeat：背景画像を繰り返さずに 1 回だけ表示する
    </div>
    <br />
    <div class="box04">
      background-repeat: repeat-x：背景画像を 水平方向（X 軸）に繰り返す
    </div>
    <br />

    <div class="box06">background-position：要素の背景画像の位置を指定する</div>
    <br />

    <div class="box07">background-attachment：背景画像を制御</div>
    <br />
    <div class="box08">background：複数のプロパティを一括で指定</div>
    <br />
  </body>
</html>
