<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css-kadai17.css" />
    <title>結合子の理解</title>
  </head>
  <body>
    <!---->
    <h1>【子孫結合子 (space)】</h1>
    <section>
      <p>テキスト1</p>
      <div>
        <p>テキスト2</p>
      </div>
      <p>テキスト3</p>
    </section>

    <!---->
    <h1>【子結合子 (>)】</h1>
    <section>
      <p>テキスト1</p>
      <div>
        <p>テキスト2</p>
      </div>
      <p>テキスト3</p>
    </section>

    <!---->
    <h1>【次兄弟結合子 (+)】</h1>
    <h1>見出し</h1>
    <p>テキスト1</p>
    <p>テキスト2</p>
    <p>テキスト3</p>

    <!---->
    <h1>【後続兄弟結合子 (~)】</h1>
    <p>テキスト1</p>
    <h1>見出し</h1>
    <p>テキスト2</p>
    <div>
      <p>テキスト3</p>
    </div>
    <p>テキスト4</p>

    <!---->
    <h1>【セレクターリスト (,)】</h1>
    <h2>同じスタイルを適用</h2>
    <h3>同じスタイルを適用</h3>
    <h4>同じスタイルを適用</h4>
  </body>
</html>
