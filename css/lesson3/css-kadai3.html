<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css-kadai3.css" />
    <title>ボーダーをデザインする</title>
  </head>
  <body>
    <!--border-style-->
    <div class="box01">
      <p>dottedを適用</p>
    </div>

    <div class="box02">
      <p>dashedを適用</p>
    </div>

    <div class="box03">
      <p>solidを適用</p>
    </div>

    <div class="box04">
      <p>doubleを適用</p>
    </div>

    <div class="box05">
      <p>noneを適用</p>
    </div>

    <div class="box06">
      <p>hiddenを適用</p>
    </div>

    <!--その他プロパティ-->
    <div class="box07">
      <p>border-widthを適用</p>
    </div>

    <div class="box08">
      <p>border-colorを適用</p>
    </div>

    <div class="box09">
      <p>borderを適用</p>
    </div>

    <div class="box10">
      <p>border-radiusを適用</p>
    </div>
  </body>
</html>
