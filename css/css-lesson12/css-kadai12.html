<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css-kadai12.css" />
    <title>テーブルのスタイリング</title>
  </head>
  <body>
    <p>border-collapse: collapse; /* セルの境界線を結合 */</p>
    <table class="box01">
      <thead>
        <tr>
          <th>項目</th>
          <th>値</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>商品A</td>
          <td>100円</td>
        </tr>
        <tr>
          <td>商品B</td>
          <td>200円</td>
        </tr>
        <tr>
          <td>商品C</td>
          <td>300円</td>
        </tr>
      </tbody>
    </table>

    <p>border-collapse: separate; /* セルの境界線を分離 */</p>
    <table class="box02">
      <thead>
        <tr>
          <th>項目</th>
          <th>値</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>商品A</td>
          <td>100円</td>
        </tr>
        <tr>
          <td>商品B</td>
          <td>200円</td>
        </tr>
        <tr>
          <td>商品C</td>
          <td>300円</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
