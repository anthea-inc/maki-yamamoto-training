<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css-kadai18-2.css" />
    <title>css-lesson18-2</title>
  </head>
  <body>
    <h1>「:nth-child(n)」：親要素の n 番目の子要素に背景色（lightgray）適用</h1>
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>

    <h1>「:only-child」：親要素の唯一の子要素に文字色（aqua）を適用</h1>
    <div>
      <p>Item 1</p>
    </div>

    <div>
      <p>Item 2</p>
      <p>Item 3</p>
    </div>
    <br /><br />
    <!--本当はリストにしたかったけど、別のスタイルと混ざるからやめる-->
    <h1>「:not(selector)」：指定されたセレクタに一致しない要素に下線を適用</h1>
    <span>Item 1</span><br />
    <span class="highlight">Item 2</span> <br />
    <span>Item 3</span> <br />
  </body>
</html>
