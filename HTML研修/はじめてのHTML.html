<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>スタイルとカラーを操ろう！</title>




     <style>
        h2 {
            color:#0000FF
        }

        h3 { color: hsl(50 50% 30); } 
           

        h3{
            color: hsl(276, 100%, 50%),
            }
           
        </style>
    </head>
    <body>
        
        <font color="#6699FF"><h1>要素のテキスト色を変更し、背景色とのコントラストを意識した選択を行ってください。</h1></font>
        <font color="#66CCCC"><p>要素のテキスト色を異なる色に設定し、本文の読みやすさがどのように変化するかを考察してください。</p></font>
    
        HTML標準の色名から5つの色を選び、それぞれの色を使った短い説明文を作成してください（例：「この色は…です」）。
        <font color="#93ffff"><p>スカイブルー？好きな色です</p></font>
        <font color="#99ffcc"><p>パステルカラーでいい感じにするのは難しいですね</p></font>
        <font color="#ffc1e0"><p>可愛い感じのピンク</p></font>
        <font color="#ffffd6"><p>見えにくい黄色</p></font>
        <font color="#ffddbc"><p>短い説明文を作るのってこれで良いのかなぁ、、</p></font>
        <p style="color:#ff0000;">スタイル属性のテスト</p>

        <h1 style="color:RGB(255,0,0)">赤色のRGBA形式</h1>
        <h2>HEX形式</h2>
        <h3>HSL形式</h3>
        <h4>RGBA形式</h4>
        <h5>HSLA形式</h5>
        
       

    </body>
</html>
